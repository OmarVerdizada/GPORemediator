name: Security and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install browser test dependency
        shell: pwsh
        run: |
          npm install --prefix work/ci-deps --no-save --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node work/ci-deps/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NODE_PATH=$pwd/work/ci-deps/node_modules" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Complete production audit
        shell: powershell
        run: |
          ./scripts/Invoke-FullAuditTests.ps1 -OutputDirectory work/audit/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
