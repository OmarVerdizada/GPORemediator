name: Security and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build and check dependencies
        shell: pwsh
        run: |
          dotnet build backend/GpoRemediator.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet list backend/GpoRemediator.csproj package --vulnerable --include-transitive --format json | Set-Content dependency-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit=Get-Content dependency-audit.json -Raw | ConvertFrom-Json
          $vulnerable=@(foreach($project in $audit.projects){foreach($framework in $project.frameworks){@($framework.topLevelPackages)+@($framework.transitivePackages) | Where-Object { $_ -and $_.vulnerabilities }}})
          if ($audit.problems -or !$audit.projects -or $vulnerable.Count -gt 0) { throw 'Dependency audit requires review' }
      - name: Server security and workflow regressions
        shell: pwsh
        run: |
          dotnet run --project scripts/SecurityRegression -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/WorkflowRegression -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/WorkspaceRegression -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project scripts/HardeningRegression -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell security and mapping regressions
        shell: powershell
        run: |
          ./scripts/Test-SecurityFiles.ps1
          ./scripts/Test-DomainSignIn.ps1
          ./scripts/Test-EndpointTargeting.ps1
          ./scripts/Test-SelectionAccess.ps1
          ./scripts/Test-SysvolDiscovery.ps1
          ./scripts/Test-RuntimeIntegrity.ps1
          ./scripts/Test-GpoMappings.ps1
          ./scripts/Test-EndpointEvidence.ps1
          ./scripts/Test-AllEndpointMappings.ps1
          ./scripts/Test-VerificationLifecycle.ps1
          ./scripts/Test-PowerShellSyntax.ps1
          ./scripts/Test-ServiceControl.ps1
          python scripts/Build-ProductionMappings.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Test-ProductionMappings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Validate-ProductionPackage.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Integrated security and scope checks
        shell: pwsh
        run: |
          python security/Secret-Pattern-Guard.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python security/Secret-Pattern-Guard.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/Audit-PolicyScopes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./security/Test-DomainGpoIsolation.ps1
      - name: Frontend regressions
        shell: pwsh
        run: |
          node scripts/Test-Responsiveness.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Build-Styles.cjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-Studio-UI.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-EnterpriseCenter.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-UX-Contract.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-ManualVerification.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-FrontendSystem.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-RemediationEvidence.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-RecipeWorkspace.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-GuidedRemediation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-GpoScopePicker.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-ControlTargeting.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-ValueEditor.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-ManualRemediation.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --no-save --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_CHANNEL='msedge'
          node scripts/Test-RecoveryUi.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-WorkflowUi.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-EndpointTargetingUi.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/Test-EnglishThemes.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
